# Loki em modo monolítico (SingleBinary): 1 pod, disco EBS, sem object storage.
# Suficiente para o volume do ToggleMaster e o mais barato possível.
# Recebe logs em OTLP nativo (/otlp) vindos do OTel Collector gateway.
deploymentMode: SingleBinary
fullnameOverride: loki

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    # Atributos OTLP que não viram label (trace_id, span_id, log.iostream...)
    # ficam como structured metadata, pesquisáveis com | trace_id="..."
    allow_structured_metadata: true
    volume_enabled: true
    retention_period: 72h
    reject_old_samples: true
    reject_old_samples_max_age: 168h
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  pattern_ingester:
    enabled: true

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 10Gi
    storageClass: gp3
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

# Modo SimpleScalable/Distributed desligado
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

gateway:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
minio:
  enabled: false
