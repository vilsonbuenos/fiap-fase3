# API key do Datadog: Secrets Manager -> Secret "datadog-api-key" (chave api-key).
# Lido pelo otel-gateway (SA otel-gateway, role otel-gateway-role via IRSA).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: datadog-api-key
  namespace: observability
spec:
  provider: aws
  parameters:
    region: us-east-2
    objects: |
      - objectName: "observability/DATADOG_API_KEY"
        objectType: secretsmanager
        objectAlias: DATADOG_API_KEY
  secretObjects:
    - secretName: datadog-api-key
      type: Opaque
      data:
        - objectName: DATADOG_API_KEY
          key: api-key
