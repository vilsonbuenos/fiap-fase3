# Admin do Grafana: o secret observability/GRAFANA_ADMIN é um JSON
# {"username": ..., "password": ...} gerado pelo Terraform.
# Lido pelo Grafana (SA grafana, role grafana-role via IRSA).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: grafana-admin
  namespace: observability
spec:
  provider: aws
  parameters:
    region: us-east-2
    objects: |
      - objectName: "observability/GRAFANA_ADMIN"
        objectType: secretsmanager
        jmesPath:
          - path: username
            objectAlias: admin-user
          - path: password
            objectAlias: admin-password
  secretObjects:
    - secretName: grafana-admin
      type: Opaque
      data:
        - objectName: admin-user
          key: admin-user
        - objectName: admin-password
          key: admin-password
