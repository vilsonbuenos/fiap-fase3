# Prometheus + Grafana + Alertmanager (chart oficial, values versionados aqui).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 93.3.0
      helm:
        releaseName: kube-prometheus-stack
        valueFiles:
          - $values/gitops/observability/values/kube-prometheus-stack.yaml
    - repoURL: https://github.com/vilsonbuenos/fiap-fase3.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # A root-app cria todas as Applications quase ao mesmo tempo; se um CRD de
    # outra Application (ex.: ServiceMonitor do kube-prometheus-stack) ainda não
    # existir, o sync falha e é refeito com backoff em vez de ficar parado.
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      # CRDs do Prometheus Operator passam do limite de annotation do client-side apply
      - ServerSideApply=true
