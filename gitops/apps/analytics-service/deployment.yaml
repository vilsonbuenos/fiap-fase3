apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  namespace: analytics-service
  labels:
    app: analytics-service
spec:
  selector:
    matchLabels:
      app: analytics-service
  strategy: {}
  template:
    metadata:
      labels:
        app: analytics-service
    spec:
      serviceAccountName: analytics-service
      containers:
      - name: analytics-service
        image: 640494160208.dkr.ecr.us-east-2.amazonaws.com/fiap-fase2/analytics-service:1.0.1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8005
        env:
        - name: OTEL_SERVICE_NAME
          value: "analytics-service"
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "service.namespace=togglemaster,deployment.environment.name=prod"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://otel-gateway.observability.svc.cluster.local:4318"
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: "http/protobuf"
        - name: OTEL_SEMCONV_STABILITY_OPT_IN
          value: "http"
        - name: PORT
          value: "8005"
        - name: AWS_REGION
          value: "us-east-2"
        - name: AWS_SQS_URL
          value: "https://sqs.us-east-2.amazonaws.com/640494160208/ToggleMasterQueue"
        - name: AWS_DYNAMODB_TABLE
          value: "ToggleMasterAnalytics"
        livenessProbe:
          httpGet:
            path: /health
            port: 8005
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8005
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
